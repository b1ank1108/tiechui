name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - crates/tiechui-tui/tests/snapshots/**
      - scripts/ui_gallery.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Regenerate so the page stamps the deployed snapshot commit.
      - run: python3 scripts/ui_gallery.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
