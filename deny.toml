[graph]
all-features = true

[advisories]
ignore = [
    # Unmaintained status only: syntect reads its bundled grammar dumps with bincode 1.3.3,
    # which the bincode authors call complete.
    { id = "RUSTSEC-2025-0141", reason = "syntect grammar dumps; no vulnerability" },
]

[licenses]
# rustls uses ISC/BSD-3-Clause code.
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "Zlib", "ISC", "BSD-3-Clause"]
private = { ignore = true }
exceptions = [
    { name = "borrow-or-share", version = "=0.2.4", allow = ["MIT-0"] },
    # Planned fuzzy matcher, used unmodified.
    { name = "nucleo", version = "=0.5.0", allow = ["MPL-2.0"] },
    { name = "nucleo-matcher", version = "=0.3.1", allow = ["MPL-2.0"] },
    # Public-domain file watcher for workspace services.
    { name = "notify", version = "=8.2.2", allow = ["CC0-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
