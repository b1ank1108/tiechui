[package]
name = "tiechui-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "tiechui"
path = "src/bin/tiechui.rs"

[[bin]]
name = "chui"
path = "src/bin/chui.rs"

# A stand-in for `codex app-server` that replays a script, for the codex runtime tests.
[[bin]]
name = "fake-codex"
path = "../../tests/e2e/fake_codex.rs"
required-features = ["fake-runtime"]
test = false

# A stand-in for `claude` that replays a script, for the claude runtime tests.
[[bin]]
name = "fake-claude"
path = "../../tests/e2e/fake_claude.rs"
required-features = ["fake-runtime"]
test = false

[dependencies]
tiechui-module-subagents.workspace = true
tiechui-module-compaction.workspace = true
tiechui-module-goal.workspace = true
tiechui-module-loop.workspace = true
tiechui-module-btw.workspace = true
tiechui-module-rewind.workspace = true
tiechui-module-context.workspace = true
tiechui-module-tool-search.workspace = true
tiechui-module-ptc.workspace = true
tiechui-module-exec.workspace = true
tiechui-module-ask.workspace = true
tiechui-module-permissions.workspace = true
tiechui-module-hooks.workspace = true
tiechui-module-plugins.workspace = true
tiechui-plugin-api.workspace = true
clap.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tiechui-config.workspace = true
tiechui-tui.workspace = true
tiechui-core.workspace = true
tiechui-model.workspace = true
tiechui-module-editing.workspace = true
tiechui-module-context-files.workspace = true
tiechui-module-skills.workspace = true
tiechui-module-prompts.workspace = true
tiechui-module-mcp.workspace = true
tiechui-protocol.workspace = true
tiechui-providers.workspace = true
tiechui-session.workspace = true
tiechui-runtime.workspace = true
tiechui-tools.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tokio-util.workspace = true
toml.workspace = true
tiechui-workspace = { workspace = true, optional = true }

[features]
default = ["workspace"]
# Files, Git and terminals in `chui app-server`.
workspace = ["dep:tiechui-workspace"]
# The scripted runtime `fake` of `chui app-server`, for tests.
fake-runtime = ["tiechui-runtime/fake-runtime"]

[dev-dependencies]
tempfile.workspace = true
tiechui-config = { workspace = true, features = ["test-support"] }
tiechui-providers = { workspace = true, features = ["testing"] }
wiremock.workspace = true

[[test]]
name = "e2e"
path = "../../tests/e2e/exec.rs"

[[test]]
name = "app_server"
path = "../../tests/e2e/app_server.rs"

[[test]]
name = "runtimes"
path = "../../tests/e2e/runtimes.rs"
required-features = ["fake-runtime"]

[[test]]
name = "codex"
path = "../../tests/e2e/codex.rs"
required-features = ["fake-runtime"]

[[test]]
name = "claude"
path = "../../tests/e2e/claude.rs"
required-features = ["fake-runtime"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
