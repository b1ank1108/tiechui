[package]
name = "tiechui-module-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
tiechui-plugin-api.workspace = true
serde.workspace = true
sha2.workspace = true
tempfile.workspace = true
url.workspace = true
tokio.workspace = true
rmcp.workspace = true
tiechui-plugin-sdk = { workspace = true, optional = true }

[dev-dependencies]
